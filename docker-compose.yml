services:
  ezbookkeeping:
    build:
      context: .
      args:
        # 初回ビルドを高速化するためユニットテストをスキップ
        SKIP_TESTS: ".*"
    container_name: ezbookkeeping
    restart: unless-stopped
    ports:
      # ホスト側 8080 は別コンテナ (photo-clock) が使用中のため 8081 を使用
      - "8081:8080"
    environment:
      # 設定は EBK_<セクション>_<キー> 形式の環境変数で conf/ezbookkeeping.ini を上書きできる
      EBK_SECURITY_SECRET_KEY: "${EBK_SECURITY_SECRET_KEY:?'.env に EBK_SECURITY_SECRET_KEY を設定してください'}"
      EBK_SERVER_DOMAIN: "localhost"
      EBK_SERVER_ROOT_URL: "http://localhost:8081/"
      # 家族のみで利用するため、初期セットアップ後は .env で無効化可能
      EBK_USER_ENABLE_REGISTER: "${EBK_USER_ENABLE_REGISTER:-true}"
      # AI/LLM 連携用 MCP サーバー (http://localhost:8081/mcp, Bearer トークン認証)
      EBK_MCP_ENABLE_MCP: "true"
      # レシート画像 AI 認識 (ホストの Ollama を host.docker.internal 経由で利用)
      EBK_LLM_TRANSACTION_FROM_AI_IMAGE_RECOGNITION: "true"
      EBK_LLM_IMAGE_RECOGNITION_LLM_PROVIDER: "ollama"
      EBK_LLM_IMAGE_RECOGNITION_OLLAMA_SERVER_URL: "http://host.docker.internal:11434/"
      EBK_LLM_IMAGE_RECOGNITION_OLLAMA_MODEL_ID: "gemma4:latest"
      # fork 独自: サーバー管理者のブートストラップ (カンマ区切りユーザー名、.env で設定)
      EBK_CUSTOM_ADMIN_USERNAMES: "${EBK_CUSTOM_ADMIN_USERNAMES:-}"
    volumes:
      - ./docker-data/data:/ezbookkeeping/data
      - ./docker-data/storage:/ezbookkeeping/storage
      - ./docker-data/log:/ezbookkeeping/log
      # gemma4 等の小型モデルでもキー名がブレないよう出力例付きプロンプトに差し替え (本家ファイルは無変更)
      - ./templates-custom/prompt/receipt_image_recognition.tmpl:/ezbookkeeping/templates/prompt/receipt_image_recognition.tmpl:ro

  # 開発・検証用インスタンス (本番の家計簿データに影響を与えずに機能検証する)
  ezbookkeeping-dev:
    build:
      context: .
      args:
        SKIP_TESTS: ".*"
    container_name: ezbookkeeping-dev
    restart: unless-stopped
    ports:
      - "8082:8080"
    environment:
      # dev 専用キー (本番とトークンを共有しないこと自体が目的なので固定値でよい)
      EBK_SECURITY_SECRET_KEY: "ezbookkeeping-dev-only-secret-key"
      EBK_SERVER_DOMAIN: "localhost"
      EBK_SERVER_ROOT_URL: "http://localhost:8082/"
      EBK_USER_ENABLE_REGISTER: "true"
      EBK_MCP_ENABLE_MCP: "true"
      # レシート画像 AI 認識 (ホストの Ollama を host.docker.internal 経由で利用)
      EBK_LLM_TRANSACTION_FROM_AI_IMAGE_RECOGNITION: "true"
      EBK_LLM_IMAGE_RECOGNITION_LLM_PROVIDER: "ollama"
      EBK_LLM_IMAGE_RECOGNITION_OLLAMA_SERVER_URL: "http://host.docker.internal:11434/"
      EBK_LLM_IMAGE_RECOGNITION_OLLAMA_MODEL_ID: "gemma4:latest"
      # fork 独自: dev ユーザーをサーバー管理者にする (LLM 接続プロファイル管理の検証用)
      EBK_CUSTOM_ADMIN_USERNAMES: "dev"
    volumes:
      - ./docker-data-dev/data:/ezbookkeeping/data
      - ./docker-data-dev/storage:/ezbookkeeping/storage
      - ./docker-data-dev/log:/ezbookkeeping/log
      # gemma4 等の小型モデルでもキー名がブレないよう出力例付きプロンプトに差し替え (本家ファイルは無変更)
      - ./templates-custom/prompt/receipt_image_recognition.tmpl:/ezbookkeeping/templates/prompt/receipt_image_recognition.tmpl:ro
