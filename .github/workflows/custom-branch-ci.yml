# fork (Mink16/ezbookkeeping) 独自の CI。custom/main と feature ブランチの品質チェックのみ行う。
# 本家の build-non-main-branch.yml (マルチアーチ Docker ビルド) は fork では無効化してある。
name: Custom Branch CI

on:
  push:
    branches:
      - custom/main
      - 'feature/**'

jobs:
  frontend:
    name: Lint & Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: i18n parity check (en/ja)
        run: node .claude/scripts/check-i18n-parity.mjs

      - name: Install dependencies
        run: npm ci

      - name: Lint (vue-tsc + ESLint)
        run: npm run lint

      - name: Unit tests (Vitest)
        run: npm test

  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Unit tests (go test)
        run: go test ./...
